name: PrismExample
options:
  bundleIdPrefix: com.luminoid
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "17.2"
  generateEmptyDirectories: true

packages:
  Prism:
    path: ..
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.7.0"

targets:
  PrismExample:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
    dependencies:
      - package: Prism
        product: PrismCore
      - package: Prism
        product: PrismUI
      - package: SnapKit
        product: SnapKit
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.luminoid.PrismExample
        SWIFT_VERSION: "6.2"
        CODE_SIGNING_ALLOWED: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: PrismExample
        CFBundleDisplayName: Prism Example
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: Camera access is required for the live preview and capture demos.
        NSMicrophoneUsageDescription: Microphone access is required for video recording demos.
        NSPhotoLibraryAddUsageDescription: Photo library access is required to save captured photos and videos.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
